<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="slideWrapper">
        <div id="slide">
            <img src="images/cat1.png" style="width: 100%;">
        </div>

        <div class="slide">
            <img src="images/cat2.png" style="width: 100%;">
        </div>

        <div class="slide">
            <img src="images/cat3.png" style="width: 100%;">
        </div>

        <div class="slide">
            <img src="images/cat4.png" style="width: 100%;">
        </div>

        <div class="slide">
            <img src="images/cat5.png" style="width: 100%;">
        </div>
    </div>

    <a class="prev">
        <img src="images/backward.png" style="width: 50px;height: 50px;" onclick="plusSlides(-1)">
    </a>

    <a class="next">
        <img src="images/forward.png" style="width: 50px;height: 50px;" onclick="plusSlides(1)">
    </a>

    <script src="main.js"></script>
</body>
</html>
